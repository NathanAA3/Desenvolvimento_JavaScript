<!DOCTYPE html>
    <html lang="pt-BR">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Minha primeira aplicação</title>
            <link rel="stylesheet" href="estilos/style.css">
            <link rel="icon" type="imgs/webp" href="imgs/odyssey.png">
        </head>


    <!-- Outras Páginas -->

    <body>

        <header class="pages">
            <img class="icon_logo2" src="imgs/settings.gif" alt="Logo">

            <h1 class="titulo-doces">Minha primeira aplicação JavaScript</h1>

            <img class="icon_logo2" src="imgs/settings.gif" alt="Logo">
        </header>


        <section class="espaco_botoes">
            <button class="bot-pages" onclick="window.open('imgs/comprovante_codigo.png', '_blank')">
                <img src="imgs/around-the-world.gif" width="24" height="24"> Códigos
            </button>

            <button class="bot-pages" onclick="window.open('imgs/comprovante_resultado.png', '_blank')">
                <img src="imgs/around-the-world.gif" width="24" height="24"> Resultados
            </button>

        </section>






        <!-- Laboratório 1 -->

            <h1>Laboratório 1</h1>

            <section class="comprovantes">

                <img src="imgs/Laboratório1.png" width="100%" height="100%">
                <img src="imgs/Laboratório1_resultado.png" width="100%" height="100%">

            </section>





        <!-- Laboratório 2 -->

        <h1>Laboratório 2</h1>

        <section class="calculadora_espaco">

            <div class="calculadora">
                <main class="container">
                    <h1>Calculadora JavaScript</h1>
                    <label for="numero1">Primeiro número:</label>
                    <input type="number" id="numero1" placeholder="Digite um número">

                    <label for="numero2">Segundo número:</label>
                    <input type="number" id="numero2" placeholder="Digite um número">

                    <button class="btn-calcular" id="btnCalcular">Calcular</button>
                        <section id="resultado" aria-live="polite">
                        Os resultados aparecerão aqui.

                        </section>
                </main>
            </div>
        </section>

        <section class="comprovantes">

            <img src="imgs/laboratorio2_calculo.png" width="100%" height="100%">
            <img src="imgs/laboratorio2_codigo.png" width="100%" height="100%">
            <img src="imgs/laboratorio2_dividir.png" width="100%" height="100%">
            <img src="imgs/laboratorio2_vazio.png" width="100%" height="100%">

        </section>





        <!-- Laboratório 3 -->

        <h1>Laboratório 3</h1>

        <section class="calculadora_media">
            <h1>Calculadora de Média</h1>

            <label for="nota1">Nota 1:</label>
            <input type="number" id="nota1" min="0" max="10" step="0.1">

            <label for="nota2">Nota 2:</label>
            <input type="number" id="nota2" min="0" max="10" step="0.1">

            <label for="nota3">Nota 3:</label>
            <input type="number" id="nota3" min="0" max="10" step="0.1">

            <button id="calcular">Calcular Média</button>

            <div id="resultado_calculos" aria-live="polite"></div>

            </section>

        </section>


        <section class="comprovantes">

            <img src="imgs/laboratorio3_css.png" width="100%" height="100%">
            <img src="imgs/laboratorio3_codigo.png" width="100%" height="100%">
            <img src="imgs/laboratorio3_media.png" width="100%" height="100%">
            <img src="imgs/laboratorio3_resultado.png" width="100%" height="100%">
            <img src="imgs/laboratorio3_resultado2.png" width="100%" height="100%">

        <script src="scripts/script.js"></script>
    </body>





    <footer>
        <p class="marca-rodape">Turn Back &copy; 2026</p>

        <div class="integrantes">
            <span>Desenvolvido por:</span>
            <strong>Nathan Victor</strong>
        </div>

    </footer>

</html
